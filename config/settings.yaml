# Configuración central del proyecto.
# Cualquier umbral aquí es un punto de partida: se valida con backtesting, no se asume óptimo.

paths:
  raw: data/raw
  processed: data/processed
  database: data/db/football.sqlite

# collect_odds: se guardan snapshots de cuotas (consume 1 petición por partido).
# Las copas se recolectan solo como calendario (congestión, rotaciones).
competitions:
  CHL:
    name: Primera División de Chile
    country: Chile
    type: league
    api_football_id: 265
    collect_odds: true
  ARG:
    name: Liga Profesional Argentina
    country: Argentina
    type: league
    api_football_id: 128
    collect_odds: true
  ARGC:
    name: Copa de la Liga Profesional (Argentina)
    country: Argentina
    type: cup
    collect_odds: false
  BRA:
    name: Brasileirão Serie A
    country: Brazil
    type: league
    api_football_id: 71
    collect_odds: true
  LIB:
    name: Copa Libertadores
    country: South America
    type: cup
    api_football_id: 13
    collect_odds: false
  SUD:
    name: Copa Sudamericana
    country: South America
    type: cup
    api_football_id: 11
    collect_odds: false

api_football:
  daily_limit: 100
  reserve: 5                 # peticiones que nunca se gastan (margen de seguridad)
  min_seconds_between: 6.5   # plan Free: 10 peticiones/minuto
  odds_horizon_hours: 48     # snapshots de cuotas para partidos que empiezan dentro de este plazo
  bookmakers_keep: []        # vacío = guardar todas las casas

betting:
  min_ev: 0.05          # EV relativo mínimo (p * cuota - 1); a calibrar en validación
  kelly_fraction: 0.25
  devig_method: proportional
