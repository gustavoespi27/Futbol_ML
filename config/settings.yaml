api_football:
  daily_limit: 100
  reserve: 5                 # peticiones que nunca se gastan (margen de seguridad)
  min_seconds_between: 6.5   # plan Free: 10 peticiones/minuto
  odds_horizon_hours: 36     # snapshots de cuotas para partidos que empiezan dentro de este plazo
  odds_refresh_hours: 10     # no se vuelve a pedir la cuota de un partido antes de este plazo
  bookmakers_keep: []        # vacío = guardar todas las casas
  # Historial a cargar una vez (plan Free: temporadas 2022-2024). La tarea diaria carga hasta
  # backfill_per_run temporadas por ejecución, solo si sobra presupuesto después de cuotas y calendario.
  backfill_per_run: 3
  backfill:
    - [WC, 2022]
    - [EURO, 2024]
    - [COPA, 2024]
    - [UNL, 2022]
    - [UNL, 2024]
    - [FRIENDLY, 2022]
    - [FRIENDLY, 2023]
    - [FRIENDLY, 2024]

betting:
  min_ev: 0.05          # EV relativo mínimo (p * cuota - 1); a calibrar en validación
  kelly_fraction: 0.25
  devig_method: proportional
