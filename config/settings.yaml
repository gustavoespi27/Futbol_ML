# Configuración central del proyecto.
# Cualquier umbral aquí es un punto de partida: se valida con backtesting, no se asume óptimo.

paths:
  raw: data/raw
  processed: data/processed
  database: data/db/football.sqlite

# collect_odds: se guardan snapshots de cuotas (consume 1 petición por partido).
# odds_priority: con 100 peticiones/día no alcanzan para todo; se piden primero las de menor número.
# type: league | cup | international (selecciones nacionales; los equipos se crean con país "World").
# I1, P1 y T1 también vienen de football-data.co.uk (histórico); API-Football agrega calendario, resultados
# y cuotas pre-partido del día (football-data puede atrasarse varias semanas).
# Las copas se recolectan solo como calendario (congestión, rotaciones).
